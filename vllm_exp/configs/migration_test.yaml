# Debug Repetition Test Configuration (sweep_test format)
# Run with: python -m vllm_exp.run sweep-test --config vllm_exp/configs/debug_repetition_sweep.yaml --log-dir logs/agent/

project: "migration_test"
type: "sweep_test"

envs:
  RAY_DEDUP_LOGS: "0"  # Disable Ray log deduplication for debugging
  NCCL_DEBUG: INFO
  NCCL_CUMEM_HOST_ENABLE: "0"
  VLLM_NCCL_SO_PATH: "/apps/easybuild-2022/easybuild/software/Compiler/GCCcore/11.3.0/NCCL/2.21.5-CUDA-12.4.1/lib/libnccl.so.2.21.5"
  VLLM_TORCH_PROFILER_DIR: /home/bxb1/data/vllm_workbench/profiler/
  RAY_CGRAPH_get_timeout: "10000"
  BENCHMARK_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/benchmark_config.json"
  DEPLOYMENT_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/vllm_config.json"
  KV_SYNC_USE_CPU: "0"
  VLLM_USE_CPU_MODEL: "0"
  CUDA_LAUNCH_BLOCKING: "0"
  PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:32"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "0"
  VLLM_USE_RAY_COMPILED_DAG: "1"
  NCCL_SOCKET_IFNAME: "bond0.3027"
  GLOO_SOCKET_IFNAME: "bond0.3027"
  VLLM_SERVER_DEV_MODE: "1"  # Enable /set_pp_config endpoint

is_log_cover: true

static_config:
  model:
    path: "/home/bxb1/data/huggingface/Qwen3-32B-FP8"
    name: "Qwen3-32B-FP8"
  
  network:
    rank_to_ip:
      0: "spartan-gpgpu169"
      1: "spartan-gpgpu007"
    rank_to_node:
      0: "spartan-gpgpu169"
      1: "spartan-gpgpu007"
  
  vllm:
    head_addr: "localhost"
    pipeline_parallel_size: 2
    gpu_memory_utilization: 0.88
    max_model_len: 8000
    chunked_prefill: true
    enable_cuda_graph: false
    enable_nsight: false
    enable_flexi_flash_attn: true
  
  benchmark:
    burstiness: 100.0
    benchmark_script_path: "/home/bxb1/vllm_workbench/vllm/benchmarks/benchmark_serving.py"
    profile: false
    print_outputs: true
    warmup:
      enabled: false
      num_total_requests: 25
      input_length: 10000
      output_length: 50
      request_rate: 25
# No sweep variables - single experiment with benchmark_config inside sweep_config
sweep_config:
  # Test repetition with 3 repetitions, no migration
  benchmark_config:
    - num_total_requests: 200  # Small number for quick testing
      repetition: 1           # 3 repetitions to test the feature
      pp_layer_config:
        0: "18, 46"           # Single config = no migration, only reset between reps
        200: "36, 28"           # Single config = no migration, only reset between reps
      requests:
        0:
          request_rate: 5.0
          input_lens: 64 
          output_lens: 64
        200:
          request_rate: 2.0
          input_lens: 1024 
          output_lens: 64
    - num_total_requests: 200  # Small number for quick testing
      repetition: 1           # 3 repetitions to test the feature
      pp_layer_config:
        0: "18, 46"           # Single config = no migration, only reset between reps
      requests:
        0:
          request_rate: 5.0
          input_lens: 64 
          output_lens: 64
        200:
          request_rate: 2.0
          input_lens: 1024 
          output_lens: 64
    - num_total_requests: 400  # Small number for quick testing
      repetition: 1           # 3 repetitions to test the feature
      pp_layer_config:
        0: "36, 28"           # Single config = no migration, only reset between reps
      requests:
        0:
          request_rate: 5.0
          input_lens: 64 
          output_lens: 64
        200:
          request_rate: 2.0
          input_lens: 1024 
          output_lens: 64
    - num_total_requests: 400  # Small number for quick testing
      repetition: 1           # 3 repetitions to test the feature
      pp_layer_config:
        0: "30, 34"           # Single config = no migration, only reset between reps
      requests:
        0:
          request_rate: 5.0
          input_lens: 64 
          output_lens: 64
        200:
          request_rate: 2.0
          input_lens: 1024 
