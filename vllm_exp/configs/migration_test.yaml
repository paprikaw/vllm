envs:
  NCCL_DEBUG: INFO
  NCCL_CUMEM_HOST_ENABLE: "0"
  VLLM_NCCL_SO_PATH: "/usr/lib/x86_64-linux-gnu/libnccl.so.2.21.5"
  VLLM_TORCH_PROFILER_DIR: /root/vllm_workbench/profiler/
  RAY_CGRAPH_get_timeout: "10000"
  BENCHMARK_CONFIG_PATH: "/tmp/vllm_exp/benchmark_config.json"
  DEPLOYMENT_CONFIG_PATH: "/tmp/vllm_exp/vllm_config.json"
projects:
  - project: "migration_test"
    type: "one_off_test"
    network:
      delays: [0]
      # 每个 pipeline 并行 rank 的可达 IP（请根据实际机器 IP 修改）
      rank_to_ip:
        0: "head"
        1: "worker1"
    vllm:
      pipeline_parallel_size: 2
      gpu_memory_utilization: 0.8
      start_pp_layer_partitions:
        - "28,36"
    migration:
      is_migration: true
      migration_steps: [50]
      alternative_configs:
        "0": [32, 32]
        "1": [16, 48]
    benchmark:
      profile: false
      data_num_requests: [100]
      input_output_lens: [ [512, 64] ]
      running_request_rates: [3]
      running_num_requests: [100]
is_log_cover: true
