# Debug Repetition Test Configuration (sweep_test format)
# Run with: python -m vllm_exp.run sweep-test --config vllm_exp/configs/debug_repetition_sweep.yaml --log-dir logs/agent/

project: "config-finder-llama"
type: "sweep_test"

envs:
  RAY_DEDUP_LOGS: "0"  # Disable Ray log deduplication for debugging
  NCCL_DEBUG: INFO
  NCCL_CUMEM_HOST_ENABLE: "0"
  VLLM_NCCL_SO_PATH: "/apps/easybuild-2022/easybuild/software/Compiler/GCCcore/11.3.0/NCCL/2.21.5-CUDA-12.4.1/lib/libnccl.so.2.21.5"
  VLLM_TORCH_PROFILER_DIR: /home/bxb1/data/vllm_workbench/profiler/
  RAY_CGRAPH_get_timeout: "10000"
  BENCHMARK_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/benchmark_config.json"
  DEPLOYMENT_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/vllm_config.json"
  KV_SYNC_USE_CPU: "0"
  VLLM_USE_CPU_MODEL: "0"
  CUDA_LAUNCH_BLOCKING: "0"
  PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:32"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "0"
  VLLM_USE_RAY_COMPILED_DAG: "16.80"
  NCCL_SOCKET_IFNAME: "bond0.3027"
  GLOO_SOCKET_IFNAME: "bond0.3027"
  VLLM_SERVER_DEV_MODE: "1"  # Enable /set_pp_config endpoint
  VLLM_DISABLE_CUTLASS_FP8: "1"  # Workaround: cutlass produces NaN on L40s
is_log_cover: true
static_config:
  model:
    path: "/data/gpfs/projects/punim2715/huggingface/Llama-3.3-70B-Instruct-FP8"
    name: "Llama-3.3-70B-Instruct-FP8"
  network:
    rank_to_ip:
      0: "spartan-gpgpu166"
      1: "spartan-gpgpu005"
    rank_to_node:
      0: "spartan-gpgpu166"
      1: "spartan-gpgpu005"
  vllm:
    head_addr: "localhost"
    pipeline_parallel_size: 2
    gpu_memory_utilization: 0.9
    max_model_len: 4000
    chunked_prefill: true
    enable_cuda_graph: false
    enable_nsight: false
    weight_chunk_size_mb: 5
    max_num_batched_tokens: 8128
  benchmark:
    burstiness: 100.0
    benchmark_script_path: "/home/bxb1/vllm_workbench/vllm/benchmarks/benchmark_serving.py"
    profile: false
    num_total_requests: 100  # Shared across all sweep combinations
    print_outputs: true
    warmup:
      enabled: false
      num_total_requests: 25
      input_length: 10000
      output_length: 50
      request_rate: 25
sweep_configs:
  # - vllm:
  #     attention_kernel: [direct]
  #     fixed_num_gpu_blocks: [-1] 
  #     weight_chunk_size_mb: [5]
  #     migration_approach: [async]
  #   benchmark:
  #     pp_layer_configs: ["43,37", "40, 40", "35, 45", "30, 50", "25,55"]  # pp_layer_partition strings
  #     # pp_layer_configs: ["30, 50", "25,55"]  # pp_layer_partition strings
  #     # pp_layer_configs: ["43,37"]  # pp_layer_partition strings
  #     request_rates: [1]
  #     input_lens: [128]
  #     output_lens: [512]
  - vllm:
      attention_kernel: [direct]
      fixed_num_gpu_blocks: [-1] 
      weight_chunk_size_mb: [5]
      migration_approach: [async]
    benchmark:
      pp_layer_configs: ["36, 44", "40, 40", "44, 36", "48, 32", "54, 28", "58, 24"]  # pp_layer_partition strings
      request_rates: [3]
      input_lens: [512]
      output_lens: [16]
