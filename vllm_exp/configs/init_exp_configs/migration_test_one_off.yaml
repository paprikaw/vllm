envs:
  NCCL_DEBUG: INFO
  NCCL_CUMEM_HOST_ENABLE: "0"
  VLLM_NCCL_SO_PATH: "/apps/easybuild-2022/easybuild/software/Compiler/GCCcore/11.3.0/NCCL/2.21.5-CUDA-12.4.1/lib/libnccl.so.2.21.5"
  VLLM_TORCH_PROFILER_DIR: /home/bxb1/data/vllm_workbench/profiler/
  RAY_CGRAPH_get_timeout: "10000"
  BENCHMARK_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/benchmark_config.json"
  DEPLOYMENT_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/vllm_config.json"
  KV_SYNC_USE_CPU: "0"
  VLLM_USE_CPU_MODEL: "0"
  CUDA_LAUNCH_BLOCKING: "0"
  NCCL_DEBUG: "INFO"
  PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:32"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "0"
  VLLM_USE_RAY_COMPILED_DAG: "1"
  # Network interface for NCCL/GLOO (required for multi-node with multiple NICs)
  # Use bond0.3027 which is on the same subnet as Ray (172.26.93.x)
  NCCL_SOCKET_IFNAME: "bond0.3027"
  GLOO_SOCKET_IFNAME: "bond0.3027"
  # Note: VLLM_HOST_IP is now set automatically per-worker in dynamic_ray_distributed_executor.py
projects:
  - project: "hete_single_node_migration_test_with_migration"
    type: "one_off_test"
    model:
      path: "/home/bxb1/data/huggingface/Qwen3-32B"
    network:
      delays: [0]
      # 每个 pipeline 并行 rank 的可达 IP（供 KV synchronizer 双向通道使用）
      rank_to_ip:
        0: "spartan-gpgpu169"
        # 1: "spartan-gpgpu003"
        1: "spartan-gpgpu169"
      # 指定每个 rank 应该部署在哪个 Ray 节点上（用于跨节点 pipeline parallelism）
      # 格式：rank -> Ray 节点的 IP 地址
      rank_to_node:
        0: "spartan-gpgpu169"    # spartan-gpgpu169 (Node 1)
        1: "spartan-gpgpu169"     # spartan-gpgpu003 (Node 2)
    vllm:
      head_addr: "localhost"
      pipeline_parallel_size: 2
      enable_flexi_flash_attn: false
      gpu_memory_utilization: 0.75
      start_pp_layer_partitions:
        - "32,32"
    migration:
      is_migration: true
      migration_steps: [1000]
      alternative_configs:
        "0": [12, 52]
        "1": [32, 32]
        "2": [20, 44]
    benchmark:
      benchmark_script_path: "/home/bxb1/vllm_workbench/vllm/benchmarks/benchmark_serving.py"
      profile: false
      print_outputs: true
      data_num_requests: [200]
      input_output_lens: [[800, 64]]
      running_num_requests: [200]
      running_request_rates: [1.8]
      burstiness: 100.0  # Higher value = more uniform rate (匀速发送)
      warmup:
        enabled: false
        data_num_requests: [25]
        input_output_lens: [[10000, 50]]
        running_request_rates: [25]
        running_num_requests: [25]
is_log_cover: true