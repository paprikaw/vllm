# Debug Repetition Test Configuration (sweep_test format)
# Run with: python -m vllm_exp.run sweep-test --config vllm_exp/configs/debug_repetition_sweep.yaml --log-dir logs/agent/

project: "heter_config_test"
type: "sweep_test"

envs:
  NCCL_DEBUG: INFO
  NCCL_CUMEM_HOST_ENABLE: "0"
  VLLM_NCCL_SO_PATH: "/apps/easybuild-2022/easybuild/software/Compiler/GCCcore/11.3.0/NCCL/2.21.5-CUDA-12.4.1/lib/libnccl.so.2.21.5"
  VLLM_TORCH_PROFILER_DIR: /home/bxb1/data/vllm_workbench/profiler/
  RAY_CGRAPH_get_timeout: "10000"
  BENCHMARK_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/benchmark_config.json"
  DEPLOYMENT_CONFIG_PATH: "/home/bxb1/data/tmp/vllm_exp/vllm_config.json"
  KV_SYNC_USE_CPU: "0"
  VLLM_USE_CPU_MODEL: "0"
  CUDA_LAUNCH_BLOCKING: "1"
  PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:32"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "0"
  VLLM_USE_RAY_COMPILED_DAG: "1"
  NCCL_SOCKET_IFNAME: "bond0.3027"
  GLOO_SOCKET_IFNAME: "bond0.3027"
  VLLM_SERVER_DEV_MODE: "1"  # Enable /set_pp_config endpoint

is_log_cover: true

static_config:
  model:
    path: "/home/bxb1/data/huggingface/Qwen3-32B"
    name: "Qwen3-32B"
  
  network:
    rank_to_ip:
      0: "spartan-gpgpu169"
      1: "spartan-gpgpu003"
    rank_to_node:
      0: "spartan-gpgpu169"
      1: "spartan-gpgpu003"
  vllm:
    head_addr: "localhost"
    pipeline_parallel_size: 2
    gpu_memory_utilization: 0.88
    max_model_len: 8000
    chunked_prefill: true
    enable_cuda_graph: false
    enable_nsight: false
  benchmark:
    burstiness: 100.0
    benchmark_script_path: "/home/bxb1/vllm_workbench/vllm/benchmarks/benchmark_serving.py"
    profile: false
    print_outputs: true
    pattern_batch_size: 150
    num_total_requests: 100
    repetition: 1
    
    # Fixed pp_layer_config with migration at request 50
    pp_layer_config:
      0: "32, 32"    # Initial config: 32 layers on each GPU
      50: "20, 44"   # Migration at request 50: 20 layers on GPU0, 44 on GPU1
    
    # Fixed request parameters
    requests:
      0:
        request_rate: 2.0
        input_lens: 500
        output_lens: 32

    warmup:
      enabled: false
      num_total_requests: 25
      input_length: 10000
      output_length: 50
      request_rate: 25

# Parameter sweep mode - sweep only vLLM parameters
# Since static_config.benchmark defines pp_layer_config + requests,
# sweep_config.benchmark should NOT be used (conflict error will be raised)
sweep_config:
  vllm:
    enable_flexi_flash_attn: [true, false]
    # Optionally sweep weight chunk size:
    # weight_chunk_size_mb: [5.0, 10.0, 20.0]

# If true, always rerun all experiments. If false, skip experiments that have already
# completed successfully (based on benchmark.log and request_metrics.csv checks)
overwrite: false