  - project: "flexi_test"
    type: "test_migration_with_different_pp"
    vllm:
      pipeline_parallel_size: 2
      gpu_memory_utilization: 0.9
      enable_flexi_flash_attn: true  # Set to true to enable Flexi Flash Attention
      start_pp_layer_partitions:
        - "8,56"
        - "16,48"
        - "20,44"
        - "24,40"
        - "28,36"
    migration:
      is_migration: false
    benchmark:
      request_rates: [2.5]
      profile: false
      num_requests:
        - 500 
      input_output_lens:
        - [512, 64]
is_log_cover: true