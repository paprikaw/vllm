  #           input_lens: 64
  #           output_lens: 64
  #         50:
  #           request_rate: 2
  #           input_lens: 512
  #           output_lens: 64
  - vllm:
      attention_kernel: [direct]
      fixed_num_gpu_blocks: [-1] 
      weight_chunk_size_mb: [5]
      migration_approach: [sync]
      block_size: [512]
    benchmark_config:
      - num_total_requests:   # Small number for quick testing
        repetition: 3           # 3 repetitions to see if leak accumulates
        pp_layer_config:
          0: "40, 40"           # Single config = no migration, only reset between reps
          10: "25, 55"           # Single config = no migration, only reset between reps
        requests:
          0:
            request_rate: 2
            input_lens: 512
            output_lens: 8
