# Minimal PP4 placement smoke test for VMXpert.
# Run with:
#   python -m vllm_exp.run sweep-test \
#     --config vllm_exp/configs/qwen_pp4_placement_smoke.yaml \
#     --log-dir logs/placement-smoke

project: "qwen_pp4_placement_smoke"
type: "sweep_test"
is_log_cover: true
overwrite: true

envs:
  RAY_DEDUP_LOGS: "0"
  NCCL_DEBUG: INFO
  NCCL_CUMEM_HOST_ENABLE: "0"
  VLLM_NCCL_SO_PATH: "/apps/easybuild-2022/easybuild/software/Compiler/GCCcore/11.3.0/NCCL/2.21.5-CUDA-12.4.1/lib/libnccl.so.2.21.5"
  RAY_CGRAPH_get_timeout: "10000"
  KV_SYNC_USE_CPU: "0"
  VLLM_USE_CPU_MODEL: "0"
  CUDA_LAUNCH_BLOCKING: "0"
  PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:32"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "0"
  VLLM_USE_RAY_COMPILED_DAG: "1"
  NCCL_SOCKET_IFNAME: "bond0.3027"
  GLOO_SOCKET_IFNAME: "bond0.3027"
  VLLM_SERVER_DEV_MODE: "1"

static_config:
  model:
    path: "/home/bxb1/data/huggingface/Qwen3-32B-FP8"
    name: "Qwen3-32B-FP8"
  network:
    placements:
      - {pp_stage: 0, node: "spartan-gpgpu066", ip: "spartan-gpgpu066"}
      - {pp_stage: 1, node: "spartan-gpgpu066", ip: "spartan-gpgpu066"}
      - {pp_stage: 2, node: "spartan-gpgpu007", ip: "spartan-gpgpu007"}
      - {pp_stage: 3, node: "spartan-gpgpu007", ip: "spartan-gpgpu007"}
  vllm:
    head_addr: "localhost"
    pipeline_parallel_size: 4
    gpu_memory_utilization: 0.90
    max_model_len: 1024
    max_num_batched_tokens: 256
    chunked_prefill: true
    enable_cuda_graph: false
    enable_nsight: false
    weight_chunk_size_mb: 5
    block_size: 128
    disable_memory_overhead_monitor: true
  benchmark:
    benchmark_script_path: "/home/bxb1/vllm_workbench/vllm/benchmarks/benchmark_serving.py"
    num_total_requests: 1000
    repetition: 1
    burstiness: 100.0
    print_outputs: false
    profile: false

sweep_config:
  vllm:
    attention_kernel: [direct]
    fixed_num_gpu_blocks: [-1]
    weight_chunk_size_mb: [5]
    migration_approach: [async]
    weight_loading_mode: [async]
    use_vmm: [true]
    enable_kv_resize: [true]
    enable_cpu_weight_cache: [true]
  benchmark:
    pp_layer_configs: ["16,16,16,16"]
    request_rates: [5]
    input_lens: [32]
    output_lens: [8]
