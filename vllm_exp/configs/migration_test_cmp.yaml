envs:
  NCCL_DEBUG: INFO
  NCCL_CUMEM_HOST_ENABLE: "0"
  VLLM_NCCL_SO_PATH: "/usr/lib/x86_64-linux-gnu/libnccl.so.2.21.5"
  VLLM_TORCH_PROFILER_DIR: /root/vllm_workbench/profiler/
  RAY_CGRAPH_get_timeout: "10000"
  BENCHMARK_CONFIG_PATH: "/tmp/vllm_exp/benchmark_config.json"
  DEPLOYMENT_CONFIG_PATH: "/tmp/vllm_exp/vllm_config.json"
  KV_SYNC_USE_CPU: "0"
  VLLM_USE_CPU_MODEL: "0"
    # Safety margin used when estimating memory for adding layers during dynamic migration
  VLLM_DYNAMIC_MIGRATION_SAFETY_MARGIN: "0.10"
projects:
  # - project: "migration_test_no_migration_8_56"
  - project: "migration_test_no_migration_24_40"
    type: "one_off_test"
    network:
      delays: [0]
      # 每个 pipeline 并行 rank 的可达 IP（请根据实际机器 IP 修改）
      rank_to_ip:
        0: "head"
        1: "worker1"
    vllm:
      pipeline_parallel_size: 2
      gpu_memory_utilization: 0.8
      start_pp_layer_partitions:
        - "24,40"
        # - "8,56"
    migration:
      is_migration: true 
      migration_steps: [500]
      alternative_configs:
        "0": [8, 56]
        "1": [8, 56]
    benchmark:
      profile: false
      print_outputs: false
      data_num_requests: [150, 150]
      input_output_lens: [[512, 64], [512, 256]]
      running_num_requests: [150, 150]
      running_request_rates: [2.2, 2]
is_log_cover: false
